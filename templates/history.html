<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analysis History</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <link
      rel="stylesheet"
      href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css"
    />
    <script src="https://code.jquery.com/jquery-3.7.0.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <div class="card history-container">
      <div class="card-body">
        <a href="{{ url_for('home') }}" class="back-link"
          >&larr; Back to Analyzer</a
        >
        <h1 class="history-title">
          Analysis History
        </h1>
        <a href="/export" class="export-btn">Export to CSV</a>
        <div class="history-chart-container">
          <canvas id="sentimentChart"></canvas>
        </div>
        <table id="historyTable" class="history-table">
          <thead>
            <tr>
              <th>Timestamp</th>
              <th>Review</th>
              <th>Sentiment</th>
              <th>Confidence</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            {% for review in reviews %}
            <tr>
              <td>{{ review['timestamp'] }}</td>
              <td>{{ review['review_text'] }}</td>
              <td class="sentiment-{{ review['sentiment'].lower() }}">
                {{ review['sentiment'] }}
              </td>
              <td>{{ review['confidence'] }}%</td>
              <td>
                <button class="delete-btn" data-id="{{ review['id'] }}">
                  Delete
                </button>
              </td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
    <script>
      // Wait for the page to load
      document.addEventListener("DOMContentLoaded", function () {
        // Fetch the statistics from our new /stats endpoint
        fetch("/stats")
          .then((response) => response.json())
          .then((data) => {
            const ctx = document
              .getElementById("sentimentChart")
              .getContext("2d");

            // Create the chart using Chart.js
            new Chart(ctx, {
              type: "pie", // We want a pie chart
              data: {
                labels: ["Positive", "Negative"],
                datasets: [
                  {
                    label: "Sentiment Breakdown",
                    // Use the data from our API, defaulting to 0 if a sentiment isn't present
                    data: [data.Positive || 0, data.Negative || 0],
                    backgroundColor: [
                      "rgba(40, 167, 69, 0.8)", // Success color (Positive)
                      "rgba(220, 53, 69, 0.8)", // Danger color (Negative)
                    ],
                    borderColor: [
                      "rgba(40, 167, 69, 1)",
                      "rgba(220, 53, 69, 1)",
                    ],
                    borderWidth: 1,
                  },
                ],
              },
              options: {
                responsive: true,
                plugins: {
                  legend: {
                    position: "top",
                    labels: { /* Ensure legend labels are white */
                        color: "white"
                    }
                  },
                  title: {
                    display: true,
                    text: "Overall Sentiment Breakdown",
                    color: "white" /* Ensure title is white */
                  },
                },
              },
            });
          });
      });
    </script>
    <script>
      $(document).ready(function () {
        $("#historyTable").DataTable();
      });
      // This code goes inside your $(document).ready(function() { ... });
      $("#historyTable").on("click", ".delete-btn", function () {
        const reviewId = $(this).data("id");
        if (confirm("Are you sure you want to delete this entry?")) {
          fetch(`/delete/${reviewId}`, { method: "POST" })
            .then((response) => response.json())
            .then((data) => {
              if (data.status === "success") {
                // Reload the page to show the updated table
                location.reload();
              }
            });
        }
      });
    </script>
  </body>
</html>
